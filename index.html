<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h1>Invoice Generator</h1>
    <form id="invoiceForm">
      <div class="form-group">
        <label>Company Name:</label>
        <input type="text" id="companyName" value="DANDY ELECTRICAL" required>
      </div>

      <div class="form-group">
        <label>Company Address:</label>
        <input type="text" id="companyAddress" value="Shop G5 MK plaza, oyus Layout Suleja Niger State" required>
      </div>

      <div class="form-group">
        <label>Phone:</label>
        <input type="text" id="phone" value="08182174231" required>
      </div>

      <div class="form-group">
        <label>Company Email:</label>
        <input type="email" id="companyEmail" placeholder="Omvpdaniel@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Tagline:</label>
        <input type="text" id="tagline" value="In God We Trust" required>
      </div>

      <div class="form-group">
        <label>Bill To:</label>
        <input type="text" id="clientName" placeholder="Client name" required>
      </div>

      <div class="form-group">
        <label>Receipt No:</label>
        <input type="text" id="receiptNo" required>
      </div>

      <div class="form-group">
        <label>Client Email:</label>
        <input type="email" id="clientEmail" required>
      </div>

      <div class="form-group">
        <label>Client Phone No:</label>
        <input type="text" id="clientPhone" required>
      </div>

      <div class="form-group">
        <label>Date:</label>
        <input type="date" id="invoiceDate" required>
      </div>

      <div class="items-section">
        <h3>Line Items</h3>
        <div id="itemsContainer"></div>
        <button type="button" id="addItemBtn" class="add-btn">+ Add Item</button>
        <div class="labour-row">
          <label for="labourDescription">Labour</label>
          <input type="text" id="labourDescription" placeholder="e.g. Wiring">
          <input type="number" id="labourCost" min="0" step="0.01" value="0" placeholder="Amount">
        </div>
      </div>

      <button type="submit" class="submit-btn">Generate Invoice</button>
    </form>
  </div>

  <div id="invoiceOutput"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
